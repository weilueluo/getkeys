[workspace]
resolver = "2"
members = ["crates/plugin-api", "crates/core", "apps/cli", "apps/desktop/src-tauri", "plugins/github", "plugins/aws", "plugins/vercel", "plugins/supabase", "plugins/openai", "plugins/anthropic", "plugins/gemini", "plugins/openrouter", "plugins/cloudflare", "plugins/gitlab", "plugins/neon", "services/auth-broker", "tools/xtask"]
default-members = ["crates/plugin-api", "crates/core", "apps/cli", "services/auth-broker", "tools/xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
getkeys-plugin-api = { path = "crates/plugin-api" }
getkeys-core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
tokio = { version = "1", features = ["full"] }
extism-pdk = "1.4.1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

[profile.release]
strip = true
lto = "thin"
