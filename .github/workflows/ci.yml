name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Called from Release, github.workflow is "Release", so releases never cancel CI or each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Select Strawberry Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (!(Test-Path -LiteralPath $perl)) { throw 'Strawberry Perl is required' }
          "PERL=$perl" >> $env:GITHUB_ENV
      - name: Install Tauri and Secret Service dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file xdg-utils \
            gnome-keyring dbus-x11
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run checks
        if: runner.os != 'Linux'
        run: npm run check
      - name: Run checks with an unlocked Secret Service keyring
        if: runner.os == 'Linux'
        # The vault key lives in the OS credential store; give the headless runner a session bus
        # and an unlocked GNOME Keyring login collection.
        run: dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && npm run check'
      - name: Verify generated contracts are committed
        run: git diff --exit-code -- apps/desktop/src/types.ts
      - name: Validate desktop packaging
        run: npm run desktop -- build --debug
      - name: Test the packaged app without a development server
        if: runner.os == 'Windows'
        run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence-${{ runner.os }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 7
